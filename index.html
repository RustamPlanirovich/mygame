<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mygame</title>
    <script>
      window.addEventListener('error', function(e) {
        if (String(e.message || '').includes('ResizeObserver loop completed')) return;
        document.body.innerHTML += '<div style="color:red;background:black;padding:10px;border:1px solid red;margin:10px;z-index:9999;position:relative;">' + 
          '<h3>Global Error</h3>' + 
          '<pre>' + (e.error ? (e.error.stack || String(e.error)) : String(e.message || 'Unknown error')) + '</pre>' + 
          '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red;background:black;padding:10px;border:1px solid red;margin:10px;z-index:9999;position:relative;">' + 
          '<h3>Unhandled Rejection</h3>' + 
          '<pre>' + (e.reason ? (e.reason.stack || e.reason) : 'Unknown reason') + '</pre>' + 
          '</div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
